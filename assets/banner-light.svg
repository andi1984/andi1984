<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">Andreas Sander</title>
<desc id="d">Senior product engineer. React &amp; TypeScript by day, Rust, Kotlin and tomatoes after hours.</desc>
<style>
@font-face{font-family:'Fraunces';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Instrument Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}
.hi{font:500 20px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#2F7D4F;letter-spacing:.02em}
.name{font:600 84px 'Fraunces', Georgia, 'Times New Roman', serif;fill:#1D2A20;letter-spacing:-.02em}
.sub{font:400 25px 'Instrument Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#5E6B60}
.tag{font:500 15px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#5E6B60;letter-spacing:.06em}
.pot{font:500 26px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#FBF7EF}
.stem{stroke-dasharray:240;animation:grow 1.4s .2s cubic-bezier(.3,.7,.3,1) both}
.leaf{transform-box:fill-box;transform-origin:0% 50%;animation:pop .55s cubic-bezier(.3,1.6,.5,1) both}
.fruit{transform-box:fill-box;transform-origin:50% 0%;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.plant{transform-origin:1000px 236px;animation:sway 7s 2.6s ease-in-out infinite alternate}
.sun{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes grow{from{stroke-dashoffset:240}}
@keyframes pop{from{transform:scale(0)}}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
